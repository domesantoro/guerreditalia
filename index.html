<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Timeline Guerre d'Italia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- UI -->
  <link rel="stylesheet" href="css/style.css">

  <!-- PRINT ONLY -->
  <link rel="stylesheet" href="css/print.css" media="print">

  <!-- LIB -->
  <script src="js/jquery.min.js"></script>
  <script src="js/jquery-ui.min.js"></script>

  <!-- DATA + APP -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</head>

<body>

<div id="topBar">

  <div class="topItem topZoom">
    Zoom:
    <input id="zoomSlider" type="range" min="120" max="600" value="260">
  </div>

  <div id="filters" class="topItem topFilters"></div>

  <div class="topItem topExport">
    <button id="printPdfBtn" type="button" onclick="window.print()">
      Stampa PDF
    </button>
  </div>

</div>

<div id="timeline">

  <div id="yearsRow"></div>

  <div id="rows"></div>

</div>

</body>
</html>
